name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (analysis-core + Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # analysis-core is consumed as com.bcosmos:analysis-core from the local
      # repository, so it must be installed before backend resolves.
      - name: Install analysis-core
        run: ./mvnw -B -ntp install
        working-directory: analysis-core

      # Testcontainers starts Postgres and Kafka; ubuntu-latest runners ship Docker.
      - name: Verify backend
        run: ./mvnw -B -ntp verify
        working-directory: backend

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            backend/target/surefire-reports/
            analysis-core/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (Angular + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # The unit-test builder runs Vitest under jsdom, so no browser is needed;
      # --watch=false makes it exit instead of waiting for changes.
      - name: Run unit tests
        run: npm test -- --watch=false
        working-directory: frontend

  ai-lab:
    name: ai-lab (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tests exercise the stdlib-only evaluation and dataset code, so only
      # pytest is needed; requirements.txt is the full local training stack.
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Run tests
        run: python -m pytest -q
        working-directory: ai-lab
