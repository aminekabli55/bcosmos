services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bcosmos
      POSTGRES_USER: bcosmos
      POSTGRES_PASSWORD: bcosmos
    ports:
      # 5432 is the documented default. A *native* PostgreSQL service installed on the host (for example
      # `postgresql-x64-18`) can hold 0.0.0.0:5432 at the same time Docker publishes it, and Windows then answers
      # `localhost:5432` with the host server: the backend fails with
      # `FATAL: password authentication failed for user "bcosmos"` while `docker compose ps` still says healthy.
      # 5433 is the escape hatch for those machines: run the backend with BCOSMOS_DB_PORT=5433.
      - "5432:5432"
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcosmos -d bcosmos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Two listeners, because Phase 5 puts the broker between two kinds of client: the Spring apps on the host
  # (the backend, the worker, the miner) and the Spark containers. The image's default single listener advertises
  # `localhost:9092`, which a container resolves to itself, so the Spark job that streams `analysis.findings.v1`
  # into bronze could never connect. EXTERNAL is what the host uses (published on the same port as before),
  # INTERNAL is the container network name.
  kafka:
    image: apache/kafka:4.3.1
    profiles: ["pipeline"]
    environment:
      # Note: passing any KAFKA_* variable turns off the image's KRaft defaults, so the whole configuration is
      # spelled out here rather than half-inherited.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      # Host clients keep the documented `localhost:9092`; inside the compose network the broker is `kafka:9092`.
      - "9092:9094"

  # Spark runs in Docker rather than as a local PySpark/JVM install (ADR 0017). Profile `spark`, used from
  # Phase 5. The jobs directory is bind-mounted, so the same scripts run locally under pytest and here under a
  # real standalone cluster.
  spark-master:
    image: apache/spark:4.2.0-python3
    profiles: ["spark"]
    hostname: spark-master
    environment:
      # Keep the daemon in the foreground so the container is the process, and advertise a routable name.
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    command: ["/opt/spark/sbin/start-master.sh"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../spark-jobs:/opt/jobs
      - sparkdata:/opt/bcosmos-data

  spark-worker:
    image: apache/spark:4.2.0-python3
    profiles: ["spark"]
    hostname: spark-worker
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ../spark-jobs:/opt/jobs
      - sparkdata:/opt/bcosmos-data

  # One-off client: `docker compose run --rm spark-submit --master spark://spark-master:7077 /opt/jobs/<job>.py`.
  # PySpark applications run in client mode (standalone does not support deploy mode for Python), so the driver
  # lives in this container and must stay alive for the duration of the job.
  spark-submit:
    image: apache/spark:4.2.0-python3
    profiles: ["spark"]
    hostname: spark-submit
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
    working_dir: /opt/jobs
    entrypoint: ["/opt/spark/bin/spark-submit"]
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ../spark-jobs:/opt/jobs
      - sparkdata:/opt/bcosmos-data

  # Runs the pytest suite for the jobs on the same image the cluster uses. Spark cannot start on the Windows host
  # (no winutils), so this is the only place the suite really runs; `spark-test` needs no master and no worker.
  #
  #   cd infrastructure && docker compose --profile spark run --rm spark-test -q tests
  spark-test:
    image: bcosmos-spark-test:4.2.0
    build:
      context: ../spark-jobs
      dockerfile: Dockerfile
    profiles: ["spark"]
    hostname: spark-test
    working_dir: /opt/jobs
    volumes:
      - ../spark-jobs:/opt/jobs

  # One-off: gives the warehouse volume to the user the jobs run as.
  #
  # A named volume is created root-owned (mode 755) while every Spark image here runs as uid 185, so the first job
  # that writes Parquet fails with `mkdir of file:/opt/bcosmos-data/... failed`. Run this once after the volume is
  # created (a fresh clone, or `docker compose down -v`):
  #
  #   cd infrastructure && docker compose --profile spark run --rm warehouse-init
  warehouse-init:
    image: apache/spark:4.2.0-python3
    profiles: ["spark"]
    user: root
    entrypoint: ["chown", "-R", "185:185", "/opt/bcosmos-data"]
    volumes:
      - sparkdata:/opt/bcosmos-data

volumes:
  pgdata:
  sparkdata:
