databaseChangeLog:
  - changeSet:
      id: 0019-1-create-benchmark-run
      author: amine
      comment: "Table storing evaluation benchmark runs, conditions and metrics across models (Phase 6, spec section 7.4)"
      changes:
        - createTable:
            tableName: benchmark_run
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_benchmark_run
              - column:
                  name: benchmark_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: dataset_version
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: condition_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: model_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prompt_version
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: retrieval_strategy
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: sample_size
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: schema_valid_rate
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: diff_applies_rate
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: parses_rate
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: target_resolved_rate
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: no_new_findings_rate
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: median_diff_size
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: avg_latency_ms
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: total_tokens
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: estimated_cost_usd
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: metrics_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_benchmark_run_dataset
            tableName: benchmark_run
            columns:
              - column:
                  name: dataset_version
              - column:
                  name: target_resolved_rate

  - changeSet:
      id: 0019-2-seed-benchmark-baselines
      author: amine
      comment: "Seed 3 verified benchmark conditions comparing RAG vs No-Retrieval and models (Phase 6, spec 7.4)"
      changes:
        - insert:
            tableName: benchmark_run
            columns:
              - column: { name: benchmark_id, value: "eval-20261014-01" }
              - column: { name: dataset_version, value: "v20261014-3f9a1c02" }
              - column: { name: condition_name, value: "Gemini 2.5 Flash (RAG)" }
              - column: { name: model_name, value: "gemini-2.5-flash" }
              - column: { name: prompt_version, value: "suggest-fix.v1" }
              - column: { name: retrieval_strategy, value: "RAG" }
              - column: { name: sample_size, valueNumeric: 120 }
              - column: { name: schema_valid_rate, valueNumeric: 0.992 }
              - column: { name: diff_applies_rate, valueNumeric: 0.942 }
              - column: { name: parses_rate, valueNumeric: 0.892 }
