              - column: { name: total_tokens, valueNumeric: 168400 }
              - column: { name: estimated_cost_usd, valueNumeric: 0.042 }
              - column: { name: metrics_json, value: '{"rulesEvaluated":["EmptyCatchBlock","UnusedPrivateMethod","AvoidCatchingGenericException","UnusedPrivateField"],"byRule":{"EmptyCatchBlock":{"resolvedRate":0.833,"sampleSize":30},"UnusedPrivateMethod":{"resolvedRate":0.767,"sampleSize":30},"AvoidCatchingGenericException":{"resolvedRate":0.633,"sampleSize":30},"UnusedPrivateField":{"resolvedRate":0.667,"sampleSize":30}}}' }
