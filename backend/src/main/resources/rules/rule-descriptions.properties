# What each baseline rule means and what a fix has to change, in one line per rule.
#
# Retrieval puts the entry for the finding's rule into the prompt (spec v2 section 7.2: "the rule description and
# examples from the rule catalog"), so the model reasons about the rule BCosmos actually applies instead of
# re-inventing what the rule name probably means.
#
# Keep this file in sync with docs/rule-catalog.md and with pmd/bcosmos-baseline.properties in analysis-core: one
# entry per rule in the baseline, named exactly as PMD names the rule (the part after the last '/' in the
# reference). RuleCatalogTest fails when the two drift apart.
EmptyCatchBlock=An exception is caught and the catch block does nothing, so the failure disappears. A fix has to do something with the exception: handle it (log it, translate it, recover), or declare it so it propagates. Deleting the catch or swallowing it differently is not a fix.
UnusedPrivateField=A private field that no method in the class reads. A fix has to either remove the field (and any writes to it) or use it; if the value is only written, the write is the thing to look at.
UnusedPrivateMethod=A private method that no code in the class calls. A fix removes the method (and any helper only it used) or calls it; removing a method that an annotation, a framework or reflection invokes is not a fix, so check for those first.
AvoidCatchingGenericException=A broad exception type (Exception, RuntimeException, Throwable, Error) is caught, which also hides failures the code did not mean to handle. A fix narrows the catch to the exception the block can actually do something about, or uses a multi-catch of those specific types. Catching the broad type and rethrowing unchanged is not a fix.
no-empty=An empty block statement hides errors or indicates incomplete code. A fix fills the block with meaningful logic or handles the error, or removes redundant empty constructs.
no-unused-vars=A declared variable or parameter is never used in scope. A fix removes the unused declaration or references it, or prefixes intentionally unused variables with an underscore.
no-explicit-any=Using the any type disables TypeScript type checking and hides type errors. A fix replaces any with a precise type, an interface, or unknown with type narrowing.
no-console=Leaving console debugging calls in code leaks sensitive details or clutters standard output. A fix removes the console call or replaces it with a structured logger.
