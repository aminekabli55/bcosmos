# BCosmos baseline rule set for TypeScript (phase 10).
#
# One ESLint rule reference per line, in definition order, so the set can be reviewed and extended without code.
# Keep this file and docs/rule-catalog.md in sync: the sha256 of this file is stored on every analysis run as the
# rule set hash, so changing it changes the identity of a run.
description=BCosmos baseline for TypeScript (phase 10): empty catch, unused variables, explicit any, console log.
rule.1=eslint/no-empty
rule.2=eslint/no-unused-vars
rule.3=typescript-eslint/no-explicit-any
rule.4=eslint/no-console
