spring:
  application:
    name: backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  datasource:
    hikari:
      pool-name: bcosmos-backend

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

bcosmos:
  repository:
    limits:
      max-files: ${BCOSMOS_MAX_FILES:20000}
      max-file-size-bytes: ${BCOSMOS_MAX_FILE_SIZE_BYTES:2000000}
    ignored-directories: []
