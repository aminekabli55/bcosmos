spring:
  application:
    name: analysis-worker
  datasource:
    # Local development defaults match infrastructure/docker-compose.yml.
    url: jdbc:postgresql://${BCOSMOS_DB_HOST:localhost}:${BCOSMOS_DB_PORT:5432}/${BCOSMOS_DB_NAME:bcosmos}
    username: ${BCOSMOS_DB_USER:bcosmos}
    password: ${BCOSMOS_DB_PASSWORD:bcosmos}
    hikari:
      pool-name: bcosmos-analysis-worker
  jpa:
    hibernate:
      # Liquibase is the only owner of the schema (ADR 0009); never let JPA change it.
      ddl-auto: validate
    open-in-view: false
  liquibase:
    # The backend owns the migrations; the worker only reads and writes rows.
    enabled: false
  kafka:
    bootstrap-servers: ${BCOSMOS_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: bcosmos-analysis-worker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

bcosmos:
  worker:
    # Maximum retry attempts before sending to DLQ (ADR 0026).
    max-retry-attempts: ${BCOSMOS_WORKER_MAX_RETRY:3}
    initial-backoff-ms: ${BCOSMOS_WORKER_INITIAL_BACKOFF_MS:500}
    backoff-multiplier: ${BCOSMOS_WORKER_BACKOFF_MULTIPLIER:2.0}
    clone-dir: ${BCOSMOS_WORKER_CLONE_DIR:data/repos}

