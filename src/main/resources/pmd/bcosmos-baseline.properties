# BCosmos baseline rule set for Java (phase 1).
#
# One PMD rule reference per line, in definition order, so the set can be reviewed and extended without code.
# Keep this file and docs/rule-catalog.md in sync: the sha256 of this file is stored on every analysis run as the
# rule set hash, so changing it changes the identity of a run.
#
# Format: <n>=<ruleset path>/<RuleName>. The reference must resolve inside the pmd-java artifact that is pinned in
# analysis-core/pom.xml; a reference that does not resolve fails the analysis loudly instead of silently finding
# nothing.
description=BCosmos baseline for Java (phase 1): empty catch, unused private field, unused local variable, unused import.
rule.1=category/java/errorprone.xml/EmptyCatchBlock
rule.2=category/java/bestpractices.xml/UnusedPrivateField
rule.3=category/java/bestpractices.xml/UnusedLocalVariable
rule.4=category/java/codestyle.xml/UnusedImports
