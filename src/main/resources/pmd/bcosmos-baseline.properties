# BCosmos baseline rule set for Java (phase 1).
#
# One PMD rule reference per line, in definition order, so the set can be reviewed and extended without code.
# Keep this file and docs/rule-catalog.md in sync: the sha256 of this file is stored on every analysis run as the
# rule set hash, so changing it changes the identity of a run.
#
# Format: <n>=<ruleset path>/<RuleName>. The reference must resolve to a rule inside the pmd-java artifact pinned
# in analysis-core/pom.xml; a reference that resolves to no rule fails the analysis loudly instead of silently
# finding nothing.
#
# Only rules that fire deterministically under the pinned PMD version belong here, because the baseline is what an
# analysis run is measured against. Two candidates were removed for that reason and are recorded in the rule
# catalog: UnusedImports (PMD removed the rule) and UnusedLocalVariable (PMD 7.28.0 reports it only when a scope has
# more than one unused local, so the simplest case silently finds nothing).
# JavaAdapterAnalyzeTest.everyBaselineRuleFires pins that every listed rule really reports something.
description=BCosmos baseline for Java (phase 1): empty catch, unused private field, unused private method, generic catch.
rule.1=category/java/errorprone.xml/EmptyCatchBlock
rule.2=category/java/bestpractices.xml/UnusedPrivateField
rule.3=category/java/bestpractices.xml/UnusedPrivateMethod
rule.4=category/java/errorprone.xml/AvoidCatchingGenericException
