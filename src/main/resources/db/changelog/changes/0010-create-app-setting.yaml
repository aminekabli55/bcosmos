databaseChangeLog:
  - changeSet:
      id: 0010-create-app-setting
      author: bcosmos
      comment: >
        Stored settings (spec v2 section 9: the Settings screen drives the registry and the AI switch from the
        browser). A single key/value table rather than one table per switch, so the ignore paths of the same screen
        can be added later without another migration. The AI master switch lives here with the deployment property
        as its default: no row means "follow bcosmos.ai.enabled", a row overrides it.
      changes:
        - createTable:
            tableName: app_setting
            remarks: One row per setting that is editable from the browser
            columns:
              - column:
                  name: setting_key
                  type: varchar(80)
                  remarks: Dotted name, e.g. ai.enabled
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: setting_value
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: app_setting
