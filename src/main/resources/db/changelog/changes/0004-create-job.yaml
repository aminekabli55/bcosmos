databaseChangeLog:
  - changeSet:
      id: 0004-create-job
      author: bcosmos
      comment: >
        Unit of work behind a run (spec v2 section 4.1). Phase 1 runs a job in-process through the JobDispatcher
        interface; phase 4 replaces that implementation with Kafka and the same row keeps its meaning, including
        the attempt counter and the error summary.
      changes:
        - createTable:
            tableName: job
            remarks: Work item of an analysis run
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: run_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempt
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: error_summary
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamp with time zone
              - column:
                  name: finished_at
                  type: timestamp with time zone
        - addForeignKeyConstraint:
            baseTableName: job
            baseColumnNames: run_id
            referencedTableName: analysis_run
            referencedColumnNames: id
            constraintName: fk_job_analysis_run
            onDelete: CASCADE
        - createIndex:
            tableName: job
            indexName: idx_job_run
            columns:
              - column:
                  name: run_id
      rollback:
        - dropTable:
            tableName: job
