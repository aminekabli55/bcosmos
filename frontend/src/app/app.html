<!-- Layered space backdrop: nebulae, two star fields, a coordinate grid and a moon. -->
<div class="cosmos-backdrop" aria-hidden="true">
  <div class="cosmos-backdrop__nebula cosmos-backdrop__nebula--violet"></div>
  <div class="cosmos-backdrop__nebula cosmos-backdrop__nebula--cyan"></div>
  <div class="cosmos-backdrop__nebula cosmos-backdrop__nebula--rose"></div>
  <div class="cosmos-backdrop__stars cosmos-backdrop__stars--near"></div>
  <div class="cosmos-backdrop__stars cosmos-backdrop__stars--far"></div>
  <div class="cosmos-backdrop__grid"></div>
  <div class="cosmos-backdrop__moon">
    <span class="cosmos-backdrop__halo"></span>
    <span class="cosmos-backdrop__disc"></span>
    <span class="cosmos-backdrop__orbit"></span>
  </div>
</div>

        stroke="currentColor"
        stroke-width="1.7"

        <circle cx="12" cy="12" r="3.1" />

      </svg>

    </span>
  </a>
